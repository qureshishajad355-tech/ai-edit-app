<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App</title>
    <!-- HilltopAds Verification Meta Tag -->
    <meta name="73a1e7d43491a7b9845a7cfed1853e2c419465a8" content="73a1e7d43491a7b9845a7cfed1853e2c419465a8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
        #timer-text {
            font-size: 15px;
            color: #555;
            margin-bottom: 15px;
        }
        .download-btn {
            display: none;
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 15px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        .download-btn:hover {
            background-color: #218838;
        }
        .ad-box {
            width: 100%;
            height: 60px;
            background: #f9f9f9;
            border: 1px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            color: #888;
            font-size: 14px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="heading">AI Edit App डाउनलोड करने के लिए तैयार है</h2>
        <div id="timer-text">कृपया <span id="countdown">8</span> सेकंड इंतज़ार करें।</div>

        <!-- Download Button (Hidden initially) -->
        <a id="downloadBtn" href="https://example.com/real-app-download-link" class="download-btn" target="_blank">डाउनलोड करें (Download)</a>

        <!-- Ad Containers (3 Adsterra + 3 HilltopAds Placeholders) -->
        <div class="ad-box">Ad 1</div>
        <div class="ad-box">Ad 2</div>
        <div class="ad-box">Ad 3</div>
        <div class="ad-box">Ad 4</div>
        <div class="ad-box">Ad 5</div>
        <div class="ad-box">Ad 6</div>
    </div>

    <script>
        let timeLeft = 8;
        const countdownElement = document.getElementById("countdown");
        const downloadBtn = document.getElementById("downloadBtn");
        const timerText = document.getElementById("timer-text");

        let downloadTimer = setInterval(function() {
            timeLeft--;
            countdownElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(downloadTimer);
                timerText.innerHTML = "आपका लिंक तैयार है!";
                downloadBtn.style.display = "block";
            }
        }, 1000);
    </script>

</body>
</html>
